[project]
name = "autodj"
version = "0.1.0"
description = "An AI DJ that plans set order and mixes tracks with DJ-style transitions"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jackson Moreno", email = "jacksonmoreno2004@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beat-this>=1.1.0",
    "demucs>=4.0.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "pydantic>=2.14.1",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
autodj = "autodj:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "safetensors>=0.8.0",
]
